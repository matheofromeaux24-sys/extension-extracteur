<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Composants web et iframe</title>
<!-- Teste la détection dans un Shadow DOM ouvert et dans une iframe de même origine. -->
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; }
  iframe { width: 100%; height: 320px; border: 1px solid #ddd; border-radius: 8px; margin-top: 24px; }
</style>
</head>
<body>
<h1>Catalogue (composants web)</h1>
<product-grid></product-grid>
<iframe title="Offres d'emploi" srcdoc="
  <style>body{font-family:system-ui;margin:12px} .job{padding:10px;border-bottom:1px solid #eee}</style>
  <h2>Offres d'emploi</h2>
  <div class='jobs'>
    <div class='job'><a href='https://jobs.example/1'>Développeur React</a><div class='company'>Acme</div><div class='city'>Paris</div></div>
    <div class='job'><a href='https://jobs.example/2'>Data analyst</a><div class='company'>Globex</div><div class='city'>Lyon</div></div>
    <div class='job'><a href='https://jobs.example/3'>Product designer</a><div class='company'>Initech</div><div class='city'>Nantes</div></div>
    <div class='job'><a href='https://jobs.example/4'>Ingénieur DevOps</a><div class='company'>Umbrella</div><div class='city'>Lille</div></div>
  </div>"></iframe>
<script>
class ProductCard extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: 'open' });
    root.innerHTML = `
      <style>:host{display:block;border:1px solid #ddd;border-radius:10px;padding:12px} img{width:100%;height:120px;object-fit:cover;background:#eee}</style>
      <img src="${this.dataset.img}" alt="">
      <h3 class="name"><a href="${this.dataset.url}">${this.dataset.name}</a></h3>
      <span class="price">${this.dataset.price}</span>`;
  }
}
class ProductGrid extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: 'open' });
    const items = [['Lampe de bureau', '39,00 €'], ['Chaise scandinave', '89,00 €'], ['Tapis berbère', '149,00 €'], ['Miroir rond', '59,00 €'], ['Étagère murale', '45,00 €'], ['Vase en grès', '24,00 €']];
    root.innerHTML = `<style>.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}</style><div class="grid">${items.map(([n, p], i) =>
      `<product-card data-name="${n}" data-price="${p}" data-url="/produit/${i + 1}" data-img="/img/p${i + 1}.jpg"></product-card>`).join('')}</div>`;
  }
}
customElements.define('product-card', ProductCard);
customElements.define('product-grid', ProductGrid);
</script>
</body>
</html>
